<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page title -->
    <title>Palindrome Checker</title>

    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <!-- Main container -->
    <div id="container">

        <!-- Page title -->
        <h1>Palindrome Checker</h1>

        <!-- Creative image -->
        <img src="Tacocat.png" alt="Palindrome Icon">

        <!-- Required form -->
        <form>
            <p>Enter a word or phrase:</p>

            <!-- User input -->
            <input type="text" id="userInput">

            <!-- Required button with onclick -->
            <br>
            <button type="button" onclick="checkPalindrome()">Check</button>
        </form>

        <!-- Result area using innerHTML -->
        <p id="result"></p>

    </div>

    <!-- External JavaScript file -->
    <script src="palindrome.js"></script>

</body>
</html>
